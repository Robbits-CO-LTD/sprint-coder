name: Install exact CI dependencies
description: Reuse an installed dependency tree while keeping workspace source links current.
inputs:
  node-version:
    description: Exact setup-node version
    required: true
runs:
  using: composite
  steps:
    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: installed-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.github/actions/install-deps/action.yml', 'ci-cache.mjs') }}
    - name: Validate current workspace links
      id: links
      if: steps.dependencies.outputs.cache-hit == 'true'
      shell: bash
      env:
        CI_NODE_VERSION: ${{ inputs.node-version }}
      run: node ci-cache.mjs dependencies >> "$GITHUB_OUTPUT"
    - name: Install dependencies on cache miss or invalid links
      if: steps.dependencies.outputs.cache-hit != 'true' || steps.links.outputs.valid != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
