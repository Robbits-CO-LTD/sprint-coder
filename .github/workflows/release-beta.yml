name: Beta Release

on:
  push:
    tags:
      - 'v*.*.*-beta.*'

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v${version}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Desktop version '${version}' is not a beta SemVer."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package version '${tag}'."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify embedded client version
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const manifest = require('./apps/desktop/package.json');
          const adapter = readFileSync(
            './apps/desktop/src/runtime-host/codex-adapter.ts',
            'utf8',
          );
          if (!adapter.includes(`version: '${manifest.version}'`)) {
            throw new Error(
              `Codex client version does not match desktop version ${manifest.version}`,
            );
          }
          NODE

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Build NativeSafeFs for Electron ABI
        run: npm run build:native-safe-fs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

  make:
    name: Make ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: macos
          - os: ubuntu-latest
            label: Ubuntu
            artifact: ubuntu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOS_CODESIGN_IDENTITY: 'Developer ID Application: ROBBITS INC. (7TDY87Y997)'
      MACOS_SIGNING_TEMP_DIR: ${{ runner.temp }}/sprint-coder-signing-${{ github.run_id }}-${{ github.run_attempt }}
      MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/sprint-coder-signing-${{ github.run_id }}-${{ github.run_attempt }}/ci-signing.keychain-db
      MACOS_CERTIFICATE_PATH: ${{ runner.temp }}/sprint-coder-signing-${{ github.run_id }}-${{ github.run_attempt }}/certificate.p12
      MACOS_API_KEY_PATH: ${{ runner.temp }}/sprint-coder-signing-${{ github.run_id }}-${{ github.run_attempt }}/AuthKey.p8
      MACOS_NOTARIZATION_ARCHIVE: ${{ runner.temp }}/sprint-coder-signing-${{ github.run_id }}-${{ github.run_attempt }}/notarization.zip
      MACOS_NOTARIZATION_RESULT: ${{ runner.temp }}/sprint-coder-signing-${{ github.run_id }}-${{ github.run_attempt }}/notarization-result.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Verify Electron binary
        run: node node_modules/electron/cli.js -p "process.versions.electron"
        env:
          ELECTRON_RUN_AS_NODE: '1'

      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Build NativeSafeFs for Electron ABI
        run: npm run build:native-safe-fs

      - name: Prepare temporary macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          for required_secret in \
            MACOS_CI_KEYCHAIN_PASSWORD \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8_BASE64; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "::error::Required macOS signing secret ${required_secret} is not configured."
              exit 1
            fi
          done

          umask 077
          mkdir -p "${MACOS_SIGNING_TEMP_DIR}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${MACOS_CERTIFICATE_PATH}"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${MACOS_API_KEY_PATH}"

          if ! grep -q -- 'BEGIN PRIVATE KEY' "${MACOS_API_KEY_PATH}"; then
            echo '::error::The restored Apple API key is not a PKCS#8 private key.'
            exit 1
          fi

          security create-keychain -p "${MACOS_CI_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${MACOS_KEYCHAIN_PATH}"
          security unlock-keychain -p "${MACOS_CI_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN_PATH}"
          security import "${MACOS_CERTIFICATE_PATH}" \
            -k "${MACOS_KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${MACOS_CI_KEYCHAIN_PASSWORD}" \
            "${MACOS_KEYCHAIN_PATH}" >/dev/null
          security list-keychains -d user -s "${MACOS_KEYCHAIN_PATH}"

          if ! security find-identity -v -p codesigning "${MACOS_KEYCHAIN_PATH}" \
            | grep -Fq -- "\"${MACOS_CODESIGN_IDENTITY}\""; then
            echo "::error::Expected code-signing identity was not imported: ${MACOS_CODESIGN_IDENTITY}"
            exit 1
          fi

      - name: Package, notarize, staple, and make macOS artifacts
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CI: 'true'
          SPRINT_CODER_RELEASE: '1'
          SPRINT_CODER_CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail

          for required_secret in APPLE_API_ISSUER_ID APPLE_API_KEY_ID; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "::error::Required Apple notarization secret ${required_secret} is not configured."
              exit 1
            fi
          done

          npx electron-forge package

          app_paths=()
          while IFS= read -r -d '' app_path; do
            app_paths+=("${app_path}")
          done < <(find out -type d -name '*.app' -prune -print0)
          if (( ${#app_paths[@]} != 1 )); then
            echo "::error::Expected one packaged macOS app, found ${#app_paths[@]}."
            exit 1
          fi
          app_path="${app_paths[0]}"

          /usr/bin/ditto -c -k --keepParent "${app_path}" "${MACOS_NOTARIZATION_ARCHIVE}"
          xcrun notarytool submit "${MACOS_NOTARIZATION_ARCHIVE}" \
            --key "${MACOS_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait \
            --output-format json > "${MACOS_NOTARIZATION_RESULT}"

          notarization_status="$('/usr/bin/plutil' -extract status raw -o - "${MACOS_NOTARIZATION_RESULT}")"
          if [[ "${notarization_status}" != 'Accepted' ]]; then
            echo "::error::Apple notarization was not accepted (status: ${notarization_status})."
            exit 1
          fi
          echo 'Apple notarization status: Accepted'

          xcrun stapler staple "${app_path}"
          xcrun stapler validate "${app_path}"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${app_path}"

          npx electron-forge make --skip-package

      - name: Make Linux release artifacts
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx electron-forge make
        env:
          CI: 'true'
          SPRINT_CODER_RELEASE: '1'

      - name: Remove temporary macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cleanup_status=0

          if [[ -e "${MACOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${MACOS_KEYCHAIN_PATH}" || cleanup_status=1
          fi
          for temporary_file in \
            "${MACOS_CERTIFICATE_PATH}" \
            "${MACOS_API_KEY_PATH}" \
            "${MACOS_NOTARIZATION_ARCHIVE}" \
            "${MACOS_NOTARIZATION_RESULT}"; do
            if [[ -e "${temporary_file}" ]]; then
              rm -f -- "${temporary_file}" || cleanup_status=1
            fi
          done
          if [[ -d "${MACOS_SIGNING_TEMP_DIR}" ]]; then
            rmdir "${MACOS_SIGNING_TEMP_DIR}" || cleanup_status=1
          fi

          exit "${cleanup_status}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sprint-coder-${{ matrix.artifact }}-${{ runner.arch }}
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Prepare draft prerelease
    needs: [validate, make]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sprint-coder-*
          path: release-assets
          merge-multiple: true

      - name: Prepare GitHub draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          assets=()
          dmg_count=0
          mac_zip_count=0
          linux_zip_count=0
          mac_zip=''
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
            case "${asset}" in
              *.dmg) ((dmg_count += 1)) ;;
              *-darwin-*.zip) mac_zip="${asset}"; ((mac_zip_count += 1)) ;;
              *-linux-*.zip) ((linux_zip_count += 1)) ;;
            esac
          done < <(
            find release-assets -type f \( -name '*.dmg' -o -name '*.zip' \) -print0
          )

          printf 'Release asset: %s\n' "${assets[@]}"
          if (( ${#assets[@]} != 3 || dmg_count != 1 || mac_zip_count != 1 || linux_zip_count != 1 )); then
            echo "::error::Expected one DMG, macOS ZIP, and Linux ZIP; found ${dmg_count}/${mac_zip_count}/${linux_zip_count}."
            find release-assets -type f -print
            exit 1
          fi

          node apps/desktop/scripts/create-macos-update-manifest.mjs \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --zip "${mac_zip}" \
            --output release-assets/RELEASES.json
          assets+=(release-assets/RELEASES.json)

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sprint Coder ${RELEASE_VERSION}" \
              --prerelease \
              --draft
          else
            create_args=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --title "Sprint Coder ${RELEASE_VERSION}"
              --generate-notes
              --prerelease
              --draft
            )
            create_args+=(--verify-tag)
            gh release create "${create_args[@]}"
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
