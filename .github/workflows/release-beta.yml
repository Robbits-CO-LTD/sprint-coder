name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v${version}"

          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            prerelease='true'
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease='false'
          else
            echo "::error::Desktop version '${version}' is not a supported stable or beta SemVer."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package version '${tag}'."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Verify release commit is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Release commit ${GITHUB_SHA} is not reachable from main."
            exit 1
          fi

      - name: Verify embedded client version
        shell: bash
        run: |
          node <<'NODE'
          const manifest = require('./apps/desktop/package.json');
          const lock = require('./package-lock.json');
          if (lock.packages?.['apps/desktop']?.version !== manifest.version) {
            throw new Error(
              `Lockfile desktop version does not match ${manifest.version}`,
            );
          }
          NODE

  validate-quality:
    name: Validate ${{ matrix.label }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: typecheck
            command: typecheck
          - label: lint
            command: lint
          - label: format
            command: format:check
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.label }}
        run: npm run ${{ matrix.command }}

  validate-package-tests:
    name: Validate package tests
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test contracts and domain packages
        run: npm run test --workspace @sprint-coder/contracts --workspace @sprint-coder/domain

  validate-desktop-tests:
    name: Validate desktop test shard ${{ matrix.shard }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Test desktop shard ${{ matrix.shard }}
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }}

  release-validation:
    name: Validate release
    needs: [metadata, validate-quality, validate-package-tests, validate-desktop-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify release validation gates
        run: echo 'All release validation gates passed.'

  make:
    name: Make ${{ matrix.label }}
    # Signing, notarization, and distributable native binaries begin only after every validation
    # gate passes. The validation gates themselves run in parallel above.
    needs: release-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: macos
            environment: macos-signing
          - os: ubuntu-latest
            label: Ubuntu
            artifact: ubuntu
          - os: windows-2022
            label: Windows x64 (unsigned)
            artifact: windows
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      MACOS_CODESIGN_IDENTITY: 'Developer ID Application: ROBBITS INC. (7TDY87Y997)'
    steps:
      - name: Require configured protected macOS signing environment
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_ENV_SENTINEL: ${{ vars.MACOS_SIGNING_ENVIRONMENT_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "${SIGNING_ENV_SENTINEL}" == 'macos-signing-v1' ]] || {
            echo '::error::Protected macos-signing environment is not configured; complete #387 setup before signing a release.'
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize temporary macOS signing paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          signing_temp_dir="${RUNNER_TEMP}/sprint-coder-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'MACOS_SIGNING_TEMP_DIR=%s\n' "${signing_temp_dir}"
            printf 'MACOS_KEYCHAIN_PATH=%s\n' "${signing_temp_dir}/ci-signing.keychain-db"
            printf 'MACOS_CERTIFICATE_PATH=%s\n' "${signing_temp_dir}/certificate.p12"
            printf 'MACOS_API_KEY_PATH=%s\n' "${signing_temp_dir}/AuthKey.p8"
            printf 'MACOS_NOTARIZATION_ARCHIVE=%s\n' "${signing_temp_dir}/notarization.zip"
            printf 'MACOS_NOTARIZATION_RESULT=%s\n' "${signing_temp_dir}/notarization-result.json"
            printf 'MACOS_DMG_NOTARIZATION_RESULT=%s\n' "${signing_temp_dir}/dmg-notarization-result.json"
          } >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Initialize MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Verify Electron binary
        run: node node_modules/electron/cli.js -p "process.versions.electron"
        env:
          ELECTRON_RUN_AS_NODE: '1'

      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner

      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Build NativeSafeFs for Electron ABI
        run: npm run build:native-safe-fs

      - name: Build Computer Use native artifact for Gate 0
        run: npm run build:computer-use-native

      - name: Verify Computer Use protocol with macOS sanitizers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/computer-use-protocol-harness"
          /usr/bin/clang++ \
            -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined \
            -I apps/desktop/computer-use-native \
            apps/desktop/computer-use-native/computer_use_protocol_fuzz.cc \
            -o "${harness}"
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            "${harness}"

      - name: Verify Computer Use protocol and attempt Windows ASan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'apps/desktop/computer-use-native/computer_use_protocol_fuzz.cc'
          $include = 'apps/desktop/computer-use-native'
          $normal = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness.exe'
          $normalObject = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness.obj'
          & cl.exe /nologo /std:c++20 /EHsc /W4 /GS /sdl "/I$include" $source "/Fo$normalObject" "/Fe$normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $asan = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness-asan.exe'
          $asanObject = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness-asan.obj'
          & cl.exe /nologo /std:c++20 /EHsc /O1 /Zi /fsanitize=address "/I$include" $source "/Fo$asanObject" "/Fe$asan"
          if ($LASTEXITCODE -ne 0) {
            'Windows ASan: SKIP - windows-2022 MSVC sanitizer compile/link unavailable; mandatory malformed-frame harness passed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          & $asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Windows ASan: PASS' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Prepare temporary macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          for required_secret in \
            MACOS_CI_KEYCHAIN_PASSWORD \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8_BASE64; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "::error::Required macOS signing secret ${required_secret} is not configured."
              exit 1
            fi
          done

          umask 077
          mkdir -p "${MACOS_SIGNING_TEMP_DIR}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${MACOS_CERTIFICATE_PATH}"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${MACOS_API_KEY_PATH}"

          if ! grep -q -- 'BEGIN PRIVATE KEY' "${MACOS_API_KEY_PATH}"; then
            echo '::error::The restored Apple API key is not a PKCS#8 private key.'
            exit 1
          fi

          security create-keychain -p "${MACOS_CI_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${MACOS_KEYCHAIN_PATH}"
          security unlock-keychain -p "${MACOS_CI_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN_PATH}"
          security import "${MACOS_CERTIFICATE_PATH}" \
            -k "${MACOS_KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${MACOS_CI_KEYCHAIN_PASSWORD}" \
            "${MACOS_KEYCHAIN_PATH}" >/dev/null
          security list-keychains -d user -s "${MACOS_KEYCHAIN_PATH}"

          if ! security find-identity -v -p codesigning "${MACOS_KEYCHAIN_PATH}" \
            | grep -Fq -- "\"${MACOS_CODESIGN_IDENTITY}\""; then
            echo "::error::Expected code-signing identity was not imported: ${MACOS_CODESIGN_IDENTITY}"
            exit 1
          fi

      - name: Package, notarize, staple, and make macOS artifacts
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CI: 'true'
          SPRINT_CODER_RELEASE: '1'
          SPRINT_CODER_CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail

          for required_secret in APPLE_API_ISSUER_ID APPLE_API_KEY_ID; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "::error::Required Apple notarization secret ${required_secret} is not configured."
              exit 1
            fi
          done

          npx electron-forge package

          app_paths=()
          while IFS= read -r -d '' app_path; do
            app_paths+=("${app_path}")
          done < <(find out -type d -name '*.app' -prune -print0)
          if (( ${#app_paths[@]} != 1 )); then
            echo "::error::Expected one packaged macOS app, found ${#app_paths[@]}."
            exit 1
          fi
          app_path="${app_paths[0]}"

          /usr/bin/ditto -c -k --keepParent "${app_path}" "${MACOS_NOTARIZATION_ARCHIVE}"
          xcrun notarytool submit "${MACOS_NOTARIZATION_ARCHIVE}" \
            --key "${MACOS_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait \
            --output-format json > "${MACOS_NOTARIZATION_RESULT}"

          notarization_status="$('/usr/bin/plutil' -extract status raw -o - "${MACOS_NOTARIZATION_RESULT}")"
          if [[ "${notarization_status}" != 'Accepted' ]]; then
            echo "::error::Apple notarization was not accepted (status: ${notarization_status})."
            exit 1
          fi
          echo 'Apple notarization status: Accepted'

          xcrun stapler staple "${app_path}"
          xcrun stapler validate "${app_path}"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${app_path}"
          /usr/sbin/spctl --assess --type execute --verbose=2 "${app_path}"

          npx electron-forge make --skip-package

          dmg_paths=()
          while IFS= read -r -d '' dmg_path; do
            dmg_paths+=("${dmg_path}")
          done < <(find out/make -type f -name '*.dmg' -print0)
          if (( ${#dmg_paths[@]} != 1 )); then
            echo "::error::Expected one macOS DMG, found ${#dmg_paths[@]}."
            exit 1
          fi
          dmg_path="${dmg_paths[0]}"

          /usr/bin/codesign --force --sign "${MACOS_CODESIGN_IDENTITY}" --timestamp "${dmg_path}"
          /usr/bin/codesign --verify --strict --verbose=2 "${dmg_path}"

          xcrun notarytool submit "${dmg_path}" \
            --key "${MACOS_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait \
            --output-format json > "${MACOS_DMG_NOTARIZATION_RESULT}"

          dmg_notarization_status="$('/usr/bin/plutil' -extract status raw -o - "${MACOS_DMG_NOTARIZATION_RESULT}")"
          if [[ "${dmg_notarization_status}" != 'Accepted' ]]; then
            echo "::error::Apple DMG notarization was not accepted (status: ${dmg_notarization_status})."
            exit 1
          fi
          echo 'Apple DMG notarization status: Accepted'

          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          /usr/sbin/spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg_path}"

      - name: Make Linux release artifacts
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx electron-forge make
        env:
          CI: 'true'
          SPRINT_CODER_RELEASE: '1'

      - name: Make and verify unsigned Windows release artifacts
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        env:
          CI: 'true'
          SPRINT_CODER_RELEASE: '1'
          SPRINT_CODER_ALLOW_UNSIGNED_WINDOWS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File scripts/ensure-inno-setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup verification failed.' }

          npm run make:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          ./scripts/verify-unsigned-windows-release.ps1 -RenamePortableZip

      - name: Remove temporary macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cleanup_status=0

          if [[ -e "${MACOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${MACOS_KEYCHAIN_PATH}" || cleanup_status=1
          fi
          for temporary_file in \
            "${MACOS_CERTIFICATE_PATH}" \
            "${MACOS_API_KEY_PATH}" \
            "${MACOS_NOTARIZATION_ARCHIVE}" \
            "${MACOS_NOTARIZATION_RESULT}" \
            "${MACOS_DMG_NOTARIZATION_RESULT}"; do
            if [[ -e "${temporary_file}" ]]; then
              rm -f -- "${temporary_file}" || cleanup_status=1
            fi
          done
          if [[ -d "${MACOS_SIGNING_TEMP_DIR}" ]]; then
            rmdir "${MACOS_SIGNING_TEMP_DIR}" || cleanup_status=1
          fi

          exit "${cleanup_status}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sprint-coder-${{ matrix.artifact }}-${{ runner.arch }}
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/Sprint-Coder-Installer.exe
            apps/desktop/out/make/**/*-full.nupkg
            apps/desktop/out/make/**/RELEASES
          if-no-files-found: error
          retention-days: 7

  make-windows-signed:
    name: Make signed Windows x64 Computer Use gate package
    if: ${{ vars.COMPUTER_USE_SIGNED_WINDOWS_GATE_ENABLED == 'true' }}
    needs: release-validation
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require configured protected Windows signing environment
        shell: pwsh
        env:
          SIGNING_ENV_SENTINEL: ${{ vars.WINDOWS_SIGNING_ENVIRONMENT_SENTINEL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_ENV_SENTINEL -ne 'windows-signing-v1') {
            throw 'Protected windows-signing environment is not configured; complete #387 setup before producing signed gate packages.'
          }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Materialize temporary Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          EXPECTED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_RELEASE_SIGNER_THUMBPRINT }}
          EXPECTED_WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_RELEASE_SIGNER_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_P12_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or
            $env:EXPECTED_WINDOWS_SIGNER_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$' -or
            [string]::IsNullOrWhiteSpace($env:EXPECTED_WINDOWS_SIGNER_SUBJECT)
          ) {
            throw 'Protected Windows signing certificate, password, or expected signer variables are unavailable.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sprint-coder-windows-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12_BASE64)
          )
          "SPRINT_CODER_WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV
          "SPRINT_CODER_WINDOWS_CERTIFICATE_PASSWORD=$($env:WINDOWS_CERTIFICATE_PASSWORD)" >> $env:GITHUB_ENV

      - name: Make signed Windows gate artifacts
        working-directory: apps/desktop
        shell: pwsh
        env:
          CI: 'true'
          SPRINT_CODER_RELEASE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File scripts/ensure-inno-setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup verification failed.' }
          npm run make:windows
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows gate build failed.' }

      - name: Verify signed Windows gate artifacts
        shell: pwsh
        env:
          EXPECTED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_RELEASE_SIGNER_THUMBPRINT }}
          EXPECTED_WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_RELEASE_SIGNER_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $desktopRoot = (Resolve-Path 'apps/desktop').Path
          $version = [string](Get-Content -Raw -LiteralPath (Join-Path $desktopRoot 'package.json') | ConvertFrom-Json).version
          $makeRoot = Join-Path $desktopRoot 'out\make'
          $installer = Join-Path $makeRoot 'squirrel.windows\x64\Sprint-Coder-Installer.exe'
          $portableSource = Join-Path $makeRoot "zip\win32\x64\Sprint Coder-win32-x64-$version.zip"
          $portable = Join-Path $makeRoot "zip\win32\x64\Sprint-Coder-win32-x64-$version.zip"
          $appRoot = Join-Path $desktopRoot 'out\Sprint Coder-win32-x64'
          $app = Join-Path $appRoot 'Sprint Coder.exe'
          $helper = Join-Path $appRoot 'resources\sprint-coder-computer-use-host.exe'
          foreach ($path in @($installer, $app, $helper)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required signed Windows gate artifact is missing: $path"
            }
          }
          if (Test-Path -LiteralPath $portableSource -PathType Leaf) {
            if (Test-Path -LiteralPath $portable) { throw "Portable ZIP destination exists: $portable" }
            Move-Item -LiteralPath $portableSource -Destination $portable
          }
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "Required signed portable ZIP is missing: $portable"
          }
          $expectedThumbprint = $env:EXPECTED_WINDOWS_SIGNER_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          $expectedSubject = [string]$env:EXPECTED_WINDOWS_SIGNER_SUBJECT
          foreach ($path in @($installer, $app, $helper)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            $thumbprint = [string]$signature.SignerCertificate.Thumbprint
            $subject = [string]$signature.SignerCertificate.Subject
            if (
              $signature.Status -ne 'Valid' -or
              $thumbprint.ToUpperInvariant() -ne $expectedThumbprint -or
              $subject -notlike "*$expectedSubject*"
            ) {
              throw "Signed Windows gate artifact does not use the configured signer: $path"
            }
          }

      - name: Remove temporary Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sprint-coder-windows-signing.pfx'
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }

      - name: Upload signed Windows gate artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: computer-use-signed-windows-x64
          path: |
            apps/desktop/out/make/zip/win32/x64/Sprint-Coder-win32-x64-*.zip
            apps/desktop/out/make/squirrel.windows/x64/Sprint-Coder-Installer.exe
          if-no-files-found: error
          retention-days: 7

  attest-computer-use-packages:
    name: Attest signed Computer Use gate packages
    if: ${{ needs.make-windows-signed.result == 'success' }}
    needs: [make, make-windows-signed]
    runs-on: ubuntu-latest
    environment: computer-use-final-gate
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Require configured protected final-gate environment
        shell: bash
        env:
          GATE_SENTINEL: ${{ vars.COMPUTER_USE_FINAL_GATE_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "${GATE_SENTINEL}" == 'computer-use-final-gate-v1' ]] || {
            echo '::error::Protected computer-use-final-gate environment is not configured; complete #387 setup before attesting packages.'
            exit 1
          }

      - name: Download notarized macOS package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: sprint-coder-macos-*
          path: ${{ runner.temp }}/computer-use-package-attestation/macos
          merge-multiple: true

      - name: Download signed Windows gate package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: computer-use-signed-windows-x64
          path: ${{ runner.temp }}/computer-use-package-attestation/windows

      - name: Require exact package set
        id: locate
        shell: bash
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/computer-use-package-attestation
        run: |
          set -euo pipefail
          mapfile -d '' portable < <(find "${PACKAGE_ROOT}/windows" -type f -name 'Sprint-Coder-win32-x64-*.zip' -print0)
          mapfile -d '' installer < <(find "${PACKAGE_ROOT}/windows" -type f -name 'Sprint-Coder-Installer.exe' -print0)
          mapfile -d '' dmg < <(find "${PACKAGE_ROOT}/macos" -type f -name '*.dmg' -print0)
          (( ${#portable[@]} == 1 && ${#installer[@]} == 1 && ${#dmg[@]} == 1 )) || {
            echo '::error::Attestation requires exactly one signed portable ZIP, installer, and notarized DMG.'
            exit 1
          }
          printf 'portable=%s\n' "${portable[0]}" >> "${GITHUB_OUTPUT}"
          printf 'installer=%s\n' "${installer[0]}" >> "${GITHUB_OUTPUT}"
          printf 'dmg=%s\n' "${dmg[0]}" >> "${GITHUB_OUTPUT}"

      - name: Attest signed Windows portable ZIP
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.locate.outputs.portable }}

      - name: Attest signed Windows installer
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.locate.outputs.installer }}

      - name: Attest notarized macOS DMG
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.locate.outputs.dmg }}

  release:
    name: Prepare draft release
    needs: [metadata, release-validation, make]
    runs-on: ubuntu-latest
    environment: release-publication
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # #387 setup must create a separately protected publication environment;
      # do not reuse macos-signing because this job does not need signing secrets.
      - name: Require configured protected publication environment
        shell: bash
        env:
          PUBLICATION_ENV_SENTINEL: ${{ vars.RELEASE_PUBLICATION_ENVIRONMENT_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "${PUBLICATION_ENV_SENTINEL}" == 'release-publication-v1' ]] || {
            echo '::error::Protected release-publication environment is not configured; complete #387 setup before publishing release assets.'
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: sprint-coder-*
          path: release-assets
          merge-multiple: true

      - name: Prepare GitHub draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=()
          dmg_count=0
          mac_zip_count=0
          linux_zip_count=0
          windows_zip_count=0
          windows_installer_count=0
          windows_nupkg_count=0
          windows_releases_count=0
          mac_zip=''
          dmg=''
          linux_zip=''
          windows_zip=''
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
            case "${asset}" in
              *.dmg) dmg="${asset}"; ((dmg_count += 1)) ;;
              *-darwin-*.zip) mac_zip="${asset}"; ((mac_zip_count += 1)) ;;
              *-linux-*.zip) linux_zip="${asset}"; ((linux_zip_count += 1)) ;;
              *-win32-x64-*.zip) windows_zip="${asset}"; ((windows_zip_count += 1)) ;;
              */Sprint-Coder-Installer.exe) ((windows_installer_count += 1)) ;;
              *-full.nupkg) ((windows_nupkg_count += 1)) ;;
              */RELEASES) ((windows_releases_count += 1)) ;;
            esac
          done < <(
            find release-assets -type f \( \
              -name '*.dmg' -o \
              -name '*.zip' -o \
              -name 'Sprint-Coder-Installer.exe' -o \
              -name '*-full.nupkg' -o \
              -name 'RELEASES' \
            \) -print0
          )

          printf 'Release asset: %s\n' "${assets[@]}"
          if (( \
            ${#assets[@]} != 7 || \
            dmg_count != 1 || \
            mac_zip_count != 1 || \
            linux_zip_count != 1 || \
            windows_zip_count != 1 || \
            windows_installer_count != 1 || \
            windows_nupkg_count != 1 || \
            windows_releases_count != 1 \
          )); then
            echo "::error::Expected complete macOS, Linux, and unsigned Windows assets."
            find release-assets -type f -print
            exit 1
          fi

          normalized_asset_dir='release-assets/normalized'
          mkdir -p "${normalized_asset_dir}"

          normalized_dmg="${normalized_asset_dir}/Sprint-Coder-${RELEASE_VERSION}-arm64.dmg"
          normalized_mac_zip="${normalized_asset_dir}/Sprint-Coder-darwin-arm64-${RELEASE_VERSION}.zip"
          normalized_linux_zip="${normalized_asset_dir}/Sprint-Coder-linux-x64-${RELEASE_VERSION}.zip"
          legacy_asset_names=()
          for legacy_asset in "${dmg}" "${mac_zip}" "${linux_zip}"; do
            legacy_asset_name="$(basename "${legacy_asset}")"
            legacy_asset_names+=("${legacy_asset_name// /.}")
          done
          for index in "${!assets[@]}"; do
            case "${assets[${index}]}" in
              "${dmg}") mv -- "${dmg}" "${normalized_dmg}"; assets[${index}]="${normalized_dmg}" ;;
              "${mac_zip}") mv -- "${mac_zip}" "${normalized_mac_zip}"; assets[${index}]="${normalized_mac_zip}" ;;
              "${linux_zip}") mv -- "${linux_zip}" "${normalized_linux_zip}"; assets[${index}]="${normalized_linux_zip}" ;;
            esac
          done
          dmg="${normalized_dmg}"
          mac_zip="${normalized_mac_zip}"
          linux_zip="${normalized_linux_zip}"

          node apps/desktop/scripts/create-macos-update-manifest.mjs \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --zip "${mac_zip}" \
            --output release-assets/RELEASES.json
          assets+=(release-assets/RELEASES.json)

          prerelease_args=()
          if [[ "${RELEASE_PRERELEASE}" == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing_release_state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft)"
            if [[ "$(jq -r '.isDraft' <<<"${existing_release_state}")" != 'true' ]]; then
              echo '::error::Release is already published; refusing to modify it.'
              exit 1
            fi
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sprint Coder ${RELEASE_VERSION}" \
              --prerelease="${RELEASE_PRERELEASE}" \
              --draft
          else
            create_args=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --title "Sprint Coder ${RELEASE_VERSION}"
              --generate-notes
              --draft
            )
            create_args+=("${prerelease_args[@]}")
            create_args+=(--verify-tag)
            gh release create "${create_args[@]}"
          fi

          release_state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft)"
          if [[ "$(jq -r '.isDraft' <<<"${release_state}")" != 'true' ]]; then
            echo '::error::Release is not a draft; refusing to replace published assets.'
            exit 1
          fi
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          expected_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "${tag_commit}" != "${expected_commit}" ]]; then
            echo "::error::Release tag targets ${tag_commit}, expected ${expected_commit}."
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          uploaded_release_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets)"
          for asset in "${assets[@]}"; do
            asset_name="$(basename "${asset}")"
            uploaded_count="$(jq --arg name "${asset_name}" '[.assets[] | select(.name == $name)] | length' <<<"${uploaded_release_assets}")"
            if [[ "${uploaded_count}" != '1' ]]; then
              echo "::error::Expected exactly one uploaded release asset named ${asset_name}."
              exit 1
            fi
          done

          for legacy_asset_name in "${legacy_asset_names[@]}"; do
            legacy_asset_api_url="$(
              jq -r --arg name "${legacy_asset_name}" \
                '.assets[] | select(.name == $name) | .apiUrl' \
                <<<"${uploaded_release_assets}"
            )"
            [[ -n "${legacy_asset_api_url}" ]] || continue
            legacy_asset_endpoint="${legacy_asset_api_url#https://api.github.com/}"
            gh api --method DELETE "${legacy_asset_endpoint}"
          done

          final_release_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets)"
          for legacy_asset_name in "${legacy_asset_names[@]}"; do
            legacy_asset_count="$(jq --arg name "${legacy_asset_name}" '[.assets[] | select(.name == $name)] | length' <<<"${final_release_assets}")"
            if [[ "${legacy_asset_count}" != '0' ]]; then
              echo "::error::Legacy release asset ${legacy_asset_name} was not removed."
              exit 1
            fi
          done

          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          managed_notes_start='<!-- sprint-coder-packages:start -->'
          managed_notes_end='<!-- sprint-coder-packages:end -->'
          existing_notes="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          generated_notes="$(
            awk \
              -v managed_start="${managed_notes_start}" \
              -v managed_end="${managed_notes_end}" \
              '$0 == managed_start { managed = 1; next }
               $0 == managed_end { managed = 0; next }
               !managed { print }' \
              <<<"${existing_notes}"
          )"
          notes_file="${RUNNER_TEMP}/sprint-coder-${RELEASE_VERSION}-release-notes.md"
          cat > "${notes_file}" <<EOF
          ${managed_notes_start}
          ## パッケージ案内

          ### Windows

          [Windows（x64版・未署名インストーラー）](${base_url}/Sprint-Coder-Installer.exe)

          > [!WARNING]
          > Windows版はコード署名されていません。初回ダウンロード・実行時にMicrosoft Defender SmartScreenの警告が表示される場合があります。配布元とファイルを確認してから実行してください。

          [Windows（x64版・portable ZIP）](${base_url}/$(basename "${windows_zip}"))

          ### macOS

          [macOS（Apple Silicon / arm64版・署名／notarization済み）](${base_url}/$(basename "${dmg}"))

          ### Linux

          [Linux（x64版・portable ZIP）](${base_url}/$(basename "${linux_zip}"))
          ${managed_notes_end}

          ${generated_notes}
          EOF
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file "${notes_file}" \
            --prerelease="${RELEASE_PRERELEASE}" \
            --draft
