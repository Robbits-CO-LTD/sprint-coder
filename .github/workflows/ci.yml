        run: npm test --workspace @sprint-coder/desktop -- ci-scope.test.mjs ci-renderer-tests.test.mjs ci-cache.test.mjs ci-test-sequencer.test.ts workflow-security.test.ts windows-e2e-workflow.test.ts forge.config.test.ts
      - name: Run Renderer tests and verify executed cases
        run: node ci-renderer-tests.mjs unit
      - name: Upload Renderer test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
