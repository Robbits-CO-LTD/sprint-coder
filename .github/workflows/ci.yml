name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NODE_VERSION: 22.23.3

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
      website_required: ${{ steps.scope.outputs.website_required }}
      scope_json: ${{ steps.scope.outputs.scope_json }}
      # Opt in only after this exact runner has repository access and passed acceptance.
      # Fork PRs and Dependabot retain disposable GitHub-hosted runners.
      common_runner: ${{ vars.SPRINT_CODER_MSI_CI_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && '["self-hosted","Windows","X64","robbits-ci","robbits-ci-ready","ci-host-msi"]' || '["ubuntu-latest"]' }}
      rust_runner: ${{ vars.SPRINT_CODER_MSI_CI_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && '["self-hosted","Windows","X64","robbits-ci","robbits-ci-ready","ci-host-msi"]' || '["windows-2022"]' }}
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select checks from the complete pull request
        id: scope
        run: node ci-scope.mjs classify
      - name: Check documentation whitespace
        if: steps.scope.outputs.mode == 'docs'
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${CI_DIFF_BASE}...${CI_DIFF_HEAD}"

  quality:
    name: quality (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'renderer'
    runs-on: ${{ fromJSON(needs.classify.outputs.common_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # MSI has one slot: install once for all three checks instead of serializing
        # three copies of checkout/cache restoration. Hosted runners stay parallel.
        include: ${{ fromJSON(contains(needs.classify.outputs.common_runner, '"ci-host-msi"') && '[{"label":"shared","command":"shared"}]' || '[{"label":"typecheck","command":"typecheck"},{"label":"lint","command":"lint"},{"label":"format","command":"format:check"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare dedicated MSI runner
        if: runner.name == 'MSI-ci'
        uses: ./.github/actions/prepare-msi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-installed-tree: ${{ runner.name != 'MSI-ci' }}

      - name: Run ${{ matrix.label }}
        if: matrix.command != 'shared'
        run: npm run ${{ matrix.command }}

      - name: Run typecheck, lint, and format with one MSI dependency tree
        if: matrix.command == 'shared'
        shell: pwsh
        run: |
          foreach ($command in 'typecheck', 'lint', 'format:check') {
            npm run $command
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  package-tests:
    name: package tests
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ fromJSON(needs.classify.outputs.common_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare dedicated MSI runner
        if: runner.name == 'MSI-ci'
        uses: ./.github/actions/prepare-msi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-installed-tree: ${{ runner.name != 'MSI-ci' }}

      - name: Test contracts and domain packages
        run: npm run test --workspace @sprint-coder/contracts --workspace @sprint-coder/domain

  sandbox-rust-windows:
    name: Rust Windows build
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ fromJSON(needs.classify.outputs.rust_runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare dedicated MSI runner
        if: runner.name == 'MSI-ci'
        uses: ./.github/actions/prepare-msi
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build Windows sandbox and compile its integration tests
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path apps/desktop/sandbox-runner/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --no-run --locked --manifest-path apps/desktop/sandbox-runner/Cargo.toml
          exit $LASTEXITCODE

  test-macos:
    name: macOS test shard ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 1/3
            coordinator: '0'
            graph: '0 1'
          - shard: 2/3
            coordinator: '2'
            graph: '2'
          - shard: 3/3
            coordinator: '1 3'
            graph: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Test desktop shard ${{ matrix.shard }}
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }} --exclude src/main/team-coordinator.test.ts --exclude src/main/graph-mission-persistence.test.ts
      - name: Test Coordinator Electron groups
        working-directory: apps/desktop
        env:
          BRIDGE_GROUPS: ${{ matrix.coordinator }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a groups <<< "${BRIDGE_GROUPS}"
          test "${#groups[@]}" -gt 0
          for group in "${groups[@]}"; do
            SPRINT_CODER_ELECTRON_BRIDGE_SHARD="${group}" \
              npx vitest run src/main/team-coordinator.test.ts --maxWorkers=1
          done
      - name: Test Graph Electron groups
        working-directory: apps/desktop
        env:
          BRIDGE_GROUPS: ${{ matrix.graph }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a groups <<< "${BRIDGE_GROUPS}"
          test "${#groups[@]}" -gt 0
          for group in "${groups[@]}"; do
            SPRINT_CODER_ELECTRON_BRIDGE_SHARD="${group}" \
              npx vitest run src/main/graph-mission-persistence.test.ts --maxWorkers=1
          done

  package-macos:
    # Full CI proves the production Forge boundary; UI acceptance uses Computer Use.
    name: macOS production package smoke
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      # Forge always packages the runner, so prepare and verify it before packaging.
      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Production package smoke
        working-directory: apps/desktop
        run: npx electron-forge package
        env:
          SPRINT_CODER_ALLOW_ADHOC_CODESIGN: '1'

  platform-tests:
    name: ${{ matrix.label }} test shard ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            shard: 1/3
          - os: ubuntu-latest
            label: Linux
            shard: 2/3
          - os: ubuntu-latest
            label: Linux
            shard: 3/3
          - os: windows-2022
            label: Windows
            shard: 1/5
          - os: windows-2022
            label: Windows
            shard: 2/5
          - os: windows-2022
            label: Windows
            shard: 3/5
          - os: windows-2022
            label: Windows
            shard: 4/5
          - os: windows-2022
            label: Windows
            shard: 5/5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Build Windows desktop control
        uses: ./.github/actions/prepare-desktop-control

      - name: Test Windows sandbox working directory and access boundary
        if: runner.os == 'Windows' && matrix.shard == '1/5'
        shell: pwsh
        run: cargo test --locked --manifest-path apps/desktop/sandbox-runner/Cargo.toml --test windows_command

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Warm Windows process identity query
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $identity = & $windowsPowerShell -NoProfile -NonInteractive -Command `
            '(Get-Process -Id $PID -ErrorAction Stop).StartTime.ToUniversalTime().Ticks'
          if ($LASTEXITCODE -ne 0 -or -not $identity) {
            throw 'Windows process identity query warm-up failed'
          }

      - name: Test desktop shard ${{ matrix.shard }} on Linux
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }}

      - name: Test desktop shard ${{ matrix.shard }} on Windows
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }} --maxWorkers=1 --exclude src/main/team-coordinator.test.ts --exclude src/main/graph-mission-persistence.test.ts

  electron-bridges:
    name: ${{ matrix.label }} ${{ matrix.suite }} Electron bridge ${{ matrix.shard }}/4
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows
            suite: coordinator
            file: src/main/team-coordinator.test.ts
            shard: 0
          - os: windows-2022
            label: Windows
            suite: coordinator
            file: src/main/team-coordinator.test.ts
            shard: 1
          - os: windows-2022
            label: Windows
            suite: coordinator
            file: src/main/team-coordinator.test.ts
            shard: 2
          - os: windows-2022
            label: Windows
            suite: coordinator
            file: src/main/team-coordinator.test.ts
            shard: 3
          - os: windows-2022
            label: Windows
            suite: graph
            file: src/main/graph-mission-persistence.test.ts
            shard: 0
          - os: windows-2022
            label: Windows
            suite: graph
            file: src/main/graph-mission-persistence.test.ts
            shard: 1
          - os: windows-2022
            label: Windows
            suite: graph
            file: src/main/graph-mission-persistence.test.ts
            shard: 2
          - os: windows-2022
            label: Windows
            suite: graph
            file: src/main/graph-mission-persistence.test.ts
            shard: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Warm Windows process identity query
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $identity = & $windowsPowerShell -NoProfile -NonInteractive -Command `
            '(Get-Process -Id $PID -ErrorAction Stop).StartTime.ToUniversalTime().Ticks'
          if ($LASTEXITCODE -ne 0 -or -not $identity) {
            throw 'Windows process identity query warm-up failed'
          }

      - name: Run bounded Electron integration group
        working-directory: apps/desktop
        run: npx vitest run ${{ matrix.file }} --maxWorkers=1
        env:
          SPRINT_CODER_ELECTRON_BRIDGE_SHARD: ${{ matrix.shard }}

  package-linux:
    name: Linux production package smoke
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Electron binary
        uses: ./.github/actions/install-electron
      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Production package smoke
        working-directory: apps/desktop
        run: npx electron-forge package

  package-windows-build:
    name: Windows production package
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.package-artifact.outputs.artifact }}
      archive_sha256: ${{ steps.package-artifact.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Electron binary
        uses: ./.github/actions/install-electron
      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox
      - name: Build Windows desktop control
        uses: ./.github/actions/prepare-desktop-control
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Build the shared Windows production package
        working-directory: apps/desktop
        run: npx electron-forge package --platform=win32 --arch=x64
      - name: Seal the package for this checkout
        id: package-artifact
        run: node ci-windows-package.mjs create
      - name: Upload the shared Windows production package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.package-artifact.outputs.artifact }}
          path: ${{ runner.temp }}/ci-windows-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  package-windows:
    name: Windows installer smoke
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Electron binary
        uses: ./.github/actions/install-electron
      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox
      - name: Build Windows desktop control
        uses: ./.github/actions/prepare-desktop-control
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Provision Inno Setup
        shell: pwsh
        run: ./apps/desktop/scripts/ensure-inno-setup.ps1
      - name: Make Windows wizard installer
        working-directory: apps/desktop
        run: npx electron-forge make --platform=win32 --arch=x64
      - name: Verify Windows wizard artifact
        shell: pwsh
        run: ./apps/desktop/scripts/verify-unsigned-windows-release.ps1

  renderer-tests:
    name: Renderer unit tests
    needs: classify
    if: needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'renderer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify CI selection and test execution contracts
        run: npm test --workspace @sprint-coder/desktop -- ci-scope.test.mjs ci-renderer-tests.test.mjs ci-cache.test.mjs ci-test-sequencer.test.ts workflow-security.test.ts forge.config.test.ts
      - name: Run Renderer tests and verify executed cases
        run: node ci-renderer-tests.mjs unit
      - name: Upload Renderer test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: renderer-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-renderer
          if-no-files-found: warn

  website:
    name: Website checks
    needs: classify
    if: needs.classify.outputs.website_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check website sources and local references
        run: node ci-website.mjs check
      - name: Check website validator regressions
        run: npm run test --workspace @sprint-coder/desktop -- ci-website.test.mjs
  required:
    name: CI required
    if: always()
    needs:
      [
        classify,
        quality,
        renderer-tests,
        package-tests,
        sandbox-rust-windows,
        test-macos,
        package-macos,
        platform-tests,
        electron-bridges,
        package-linux,
        package-windows-build,
        package-windows,
        website,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify every selected check completed successfully
        env:
          CI_SCOPE_JSON: ${{ needs.classify.outputs.scope_json }}
          CI_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node ci-scope.mjs gate
