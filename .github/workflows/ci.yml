name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR classifier compares the real base and head commits. A complete checkout avoids
          # silently selecting the fast lane when a long-lived PR's base commit is outside a
          # shallow clone.
          fetch-depth: 0

      - name: Select fast or full platform coverage
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          full_matrix=true
          if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
            full_matrix=false
            changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
            printf '%s\n' "${changed_files}"

            # Renderer, styling, docs, and pure package changes use the fast lane. Changes that
            # can alter native ABI, Electron startup, filesystem/process behavior, packaging, or
            # the CI contract itself retain the Linux + Windows platform matrix.
            if grep -Eq '(^|/)package(-lock)?\.json$|^\.github/workflows/|^build-native-safe-fs\.mjs$|^playwright.*\.ts$|^tests/e2e/|^apps/desktop/(forge\.config\.ts|vite\..*\.config\.ts|native-safe-fs/|scripts/)|^apps/desktop/src/(main|preload|runtime-host)/' <<< "${changed_files}"; then
              full_matrix=true
            fi
          fi

          echo "full_matrix=${full_matrix}" >> "${GITHUB_OUTPUT}"
          echo "Selected full matrix: ${full_matrix}"

  quality:
    # Preserve the existing Linux check name for repository rules while moving slow native and
    # packaged-app checks to the conditional platform matrix.
    name: build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test-macos:
    # macOS currently completes the full suite in about two minutes, so it is the always-on test
    # lane. It gives every PR complete Vitest coverage while Linux/Windows focus on their platform
    # boundaries only when relevant.
    name: build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Test
        run: npm run test

  windows-smoke:
    name: build (windows-2022, smoke)
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.full_matrix != 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These specs exercise named pipes, process teardown, ACLs, watchers, and atomic file
      # replacement without paying for the Electron ABI rebuild required by the full suite.
      - name: Test Windows platform boundaries
        working-directory: apps/desktop
        run: >-
          npx vitest run
          src/main/command-runner.test.ts
          src/main/native-file-publication.test.ts
          src/main/process-tree.test.ts
          src/main/team-mcp-bridge.test.ts
          src/main/windows-acl.test.ts
          src/main/workspace-edit.test.ts
          src/main/workspace-watcher.test.ts
          src/runtime-host/team-mcp-node-command.test.ts
          --maxWorkers=1

  platform:
    name: build (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest, full
          # The Electron node-gyp revision in the lockfile supports Visual Studio through 2022.
          # Keep Windows on the supported image until that dependency is updated. Vitest stays on
          # one worker for process stability, with files split across independent runners.
          - os: windows-2022
            label: windows-2022, shard 1/2
            windows_shard: 1/2
          - os: windows-2022
            label: windows-2022, shard 2/2
            windows_shard: 2/2
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 43 downloads its platform binary on first use. Install it once before workers can
      # race to extract the same archive into node_modules/electron/dist.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Verify Electron binary
        run: node node_modules/electron/cli.js -p "process.versions.electron"
        env:
          ELECTRON_RUN_AS_NODE: '1'

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Test
        if: runner.os != 'Windows'
        run: npm run test

      - name: Test Windows shard ${{ matrix.windows_shard }}
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.windows_shard }}

      - name: Provision Inno Setup
        if: github.event_name == 'push' && runner.os == 'Windows' && matrix.windows_shard == '1/2'
        shell: pwsh
        run: ./apps/desktop/scripts/ensure-inno-setup.ps1

      - name: Make Windows wizard installer
        if: github.event_name == 'push' && runner.os == 'Windows' && matrix.windows_shard == '1/2'
        working-directory: apps/desktop
        run: npx electron-forge make --platform=win32 --arch=x64

      - name: Verify Windows wizard artifact
        if: github.event_name == 'push' && runner.os == 'Windows' && matrix.windows_shard == '1/2'
        shell: pwsh
        run: |
          $directory = 'apps/desktop/out/make/squirrel.windows/x64'
          $wizard = Join-Path $directory 'Sprint-Coder-Installer.exe'
          $rawSetup = Join-Path $directory 'Sprint-Coder-Setup.exe'
          if (-not (Test-Path -LiteralPath $wizard -PathType Leaf)) {
            throw "Wizard installer was not created: $wizard"
          }
          if (Test-Path -LiteralPath $rawSetup) {
            throw "Raw Squirrel setup must not remain user-facing: $rawSetup"
          }
          Get-Item -LiteralPath $wizard | Format-List FullName,Length,VersionInfo

      - name: Packaged startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test tests/e2e/keyboard-smoke.spec.ts
        env:
          SPRINT_CODER_E2E_MODE: packaged

      - name: Dev-mode E2E auto-start smoke (Windows)
        if: runner.os == 'Windows' && matrix.windows_shard == '1/2'
        run: npx playwright test tests/e2e/keyboard-smoke.spec.ts
        env:
          SPRINT_CODER_E2E_MODE: dev

  # Preserve the existing aggregate check name. It succeeds through either the focused PR smoke
  # or the full platform matrix, so repository rules do not need conditional required checks.
  windows-result:
    name: build (windows-2022)
    if: always()
    needs: [classify, windows-smoke, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify selected Windows coverage
        shell: bash
        env:
          FULL_MATRIX: ${{ needs.classify.outputs.full_matrix }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          SMOKE_RESULT: ${{ needs.windows-smoke.result }}
        run: |
          set -euo pipefail
          if [[ "${FULL_MATRIX}" == 'true' ]]; then
            test "${PLATFORM_RESULT}" = 'success'
          else
            test "${SMOKE_RESULT}" = 'success'
          fi

  required:
    name: CI required
    if: always()
    needs: [quality, test-macos, windows-result]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          WINDOWS_RESULT: ${{ needs.windows-result.result }}
        run: |
          test "${QUALITY_RESULT}" = 'success'
          test "${MACOS_RESULT}" = 'success'
          test "${WINDOWS_RESULT}" = 'success'
