name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NODE_VERSION: 22.23.3

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
      website_required: ${{ steps.scope.outputs.website_required }}
      e2e_specs: ${{ steps.scope.outputs.e2e_specs }}
      e2e_matrix: ${{ steps.scope.outputs.e2e_matrix }}
      scope_json: ${{ steps.scope.outputs.scope_json }}
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select checks from the complete pull request
        id: scope
        run: node ci-scope.mjs classify
      - name: Check documentation whitespace
        if: steps.scope.outputs.mode == 'docs'
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${CI_DIFF_BASE}...${CI_DIFF_HEAD}"

  quality:
    name: quality (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'renderer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: typecheck
            command: typecheck
          - label: lint
            command: lint
          - label: format
            command: format:check
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ${{ matrix.label }}
        run: npm run ${{ matrix.command }}

  package-tests:
    name: package tests
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test contracts and domain packages
        run: npm run test --workspace @sprint-coder/contracts --workspace @sprint-coder/domain

  computer-use-native-gate:
    name: Computer Use native Gate 0 (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # ADR v2 D7-3: macOS is built and checked in both eligibility modes. Windows has no
        # deny-list until S5, so it is built as v1 only. Only v1 ever ships (release-beta builds v1).
        include:
          - label: macOS
            os: macos-latest
            eligibility: v1
          - label: macOS v2
            os: macos-latest
            eligibility: v2
          - label: Windows
            os: windows-2022
            eligibility: v1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Initialize MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Compile and manifest native artifact
        run: npm run build:computer-use-native -- --eligibility=${{ matrix.eligibility }}

      - name: Verify the built artifact attests what its manifest declares
        run: node verify-computer-use-eligibility.mjs --expect=${{ matrix.eligibility }} --require --report=${{ runner.temp }}/computer-use-eligibility-report.json

      - name: Build deterministic Win32 acceptance fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'computer-use-win32-acceptance-fixture'
          ./apps/desktop/computer-use-native/fixtures/win32-acceptance/build.ps1 `
            -OutputDirectory $output

      - name: Run protocol harness with macOS sanitizers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/computer-use-protocol-harness"
          /usr/bin/clang++ \
            -std=c++20 -O1 -g -fno-omit-frame-pointer -Werror=switch \
            -fsanitize=address,undefined \
            -I apps/desktop/computer-use-native \
            -I apps/desktop/computer-use-native/generated \
            -DSPRINT_CODER_EXPECT_ELIGIBILITY_V2=${{ matrix.eligibility == 'v2' && '1' || '0' }} \
            apps/desktop/computer-use-native/computer_use_protocol_fuzz.cc \
            -o "${harness}"
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            "${harness}"
          # S5-c-3 PR-1: the shared target eligibility core, compiled by clang as well.
          target="${RUNNER_TEMP}/computer-use-target-eligibility-harness"
          /usr/bin/clang++ \
            -std=c++20 -O1 -g -fno-omit-frame-pointer -Wall -Wextra -Werror=switch \
            -fsanitize=address,undefined \
            -I apps/desktop/computer-use-native \
            -I apps/desktop/computer-use-native/generated \
            -DSPRINT_CODER_EXPECT_ELIGIBILITY_V2=${{ matrix.eligibility == 'v2' && '1' || '0' }} \
            apps/desktop/computer-use-native/computer_use_target_eligibility_harness.cc \
            -o "${target}"
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            "${target}"

      - name: Run protocol harness and attempt Windows ASan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'apps/desktop/computer-use-native/computer_use_protocol_fuzz.cc'
          $include = 'apps/desktop/computer-use-native'
          $normal = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness.exe'
          $normalObject = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness.obj'
          # /utf-8: the harness sources carry CJK lexicon terms; the default code page would misread them.
          & cl.exe /nologo /std:c++20 /EHsc /W4 /GS /sdl /utf-8 /we4062 "/I$include" $source "/Fo$normalObject" "/Fe$normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $asan = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness-asan.exe'
          $asanObject = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness-asan.obj'
          & cl.exe /nologo /std:c++20 /EHsc /O1 /Zi /utf-8 /fsanitize=address "/I$include" $source "/Fo$asanObject" "/Fe$asan"
          if ($LASTEXITCODE -ne 0) {
            'Windows ASan: SKIP - windows-2022 MSVC sanitizer compile/link unavailable; mandatory malformed-frame harness passed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          & $asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Windows ASan: PASS' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify Gate 0 loader tests
        working-directory: apps/desktop
        env:
          COMPUTER_USE_ELIGIBILITY_REPORT: ${{ runner.temp }}/computer-use-eligibility-report.json
        run: >-
          npx vitest run
          src/main/computer-use-native.test.ts
          src/main/computer-use-eligibility-artifact.test.ts
          src/main/computer-use-windows-ticket.test.ts
          src/main/computer-use-windows-ticket-seam.test.ts
          verify-computer-use-eligibility.test.mjs
          computer-use-native/fixtures/win32-acceptance/win32_acceptance_fixture.test.ts
      - name: Test Windows sandbox working directory and access boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked --manifest-path apps/desktop/sandbox-runner/Cargo.toml --test windows_command

  computer-use-windows-v2-harness:
    # S5-c-3 PR-1 (#500): Windows may not build a v2 (deny-list) native yet, so
    # build-computer-use-eligibility.mjs and the contracts still refuse it. This row compiles only
    # the portable harnesses and the target eligibility seam as v2 with MSVC; no artifact is built.
    # PR-2 adds the live seam of the host's target facts (still called from nowhere).
    name: Computer Use native Windows v2 harness
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Check the generated deny ruleset is current
        run: node generate-computer-use-deny-ruleset.mjs --check

      - name: Run the portable harnesses compiled as v2
        shell: pwsh
        run: |
          $include = 'apps/desktop/computer-use-native'
          foreach ($name in 'computer_use_protocol_fuzz', 'computer_use_target_eligibility_harness') {
            $source = Join-Path $include "$name.cc"
            $binary = Join-Path $env:RUNNER_TEMP "$name-v2.exe"
            $object = Join-Path $env:RUNNER_TEMP "$name-v2.obj"
            # /utf-8: the harness sources carry CJK lexicon terms; the default code page would misread them.
            & cl.exe /nologo /std:c++20 /EHsc /W4 /GS /sdl /utf-8 /we4062 /DSPRINT_CODER_ELIGIBILITY_V2=1 /DSPRINT_CODER_EXPECT_ELIGIBILITY_V2=1 "/I$include" $source "/Fo$object" "/Fe$binary"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $binary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run the target eligibility seam compiled as v2
        working-directory: apps/desktop
        env:
          COMPUTER_USE_SEAM_ELIGIBILITY_V2: '1'
        run: >-
          npx vitest run
          src/main/computer-use-target-eligibility.test.ts
          src/main/computer-use-target-eligibility-seam.test.ts

      # S5-c-3 PR-2 (#500): the host's target facts measured on processes the seam starts itself
      # (cmd, conhost, a renamed cmd, mstsc, the fixture, its own child, lineage, a rename swap).
      - name: Run the Windows target facts live seam
        working-directory: apps/desktop
        run: >-
          npx vitest run
          src/main/computer-use-windows-target-facts-live-seam.test.ts

  test-macos:
    name: macOS test shard ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 1/3
            coordinator: '0'
            graph: '0 1'
          - shard: 2/3
            coordinator: '2'
            graph: '2'
          - shard: 3/3
            coordinator: '1 3'
            graph: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Test desktop shard ${{ matrix.shard }}
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }} --exclude src/main/team-coordinator.test.ts --exclude src/main/graph-mission-persistence.test.ts
      - name: Test Coordinator Electron groups
        working-directory: apps/desktop
        env:
          BRIDGE_GROUPS: ${{ matrix.coordinator }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a groups <<< "${BRIDGE_GROUPS}"
          test "${#groups[@]}" -gt 0
          for group in "${groups[@]}"; do
            SPRINT_CODER_ELECTRON_BRIDGE_SHARD="${group}" \
              npx vitest run src/main/team-coordinator.test.ts --maxWorkers=1
          done
      - name: Test Graph Electron groups
        working-directory: apps/desktop
        env:
          BRIDGE_GROUPS: ${{ matrix.graph }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a groups <<< "${BRIDGE_GROUPS}"
          test "${#groups[@]}" -gt 0
          for group in "${groups[@]}"; do
            SPRINT_CODER_ELECTRON_BRIDGE_SHARD="${group}" \
              npx vitest run src/main/graph-mission-persistence.test.ts --maxWorkers=1
          done

  package-macos:
    # Full CI proves the production Forge boundary and packaged desktop behavior.
    name: macOS production package smoke
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      # Forge always packages the runner, so prepare and verify it before packaging.
      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Production package smoke
        working-directory: apps/desktop
        run: npx electron-forge package
        env:
          SPRINT_CODER_ALLOW_ADHOC_CODESIGN: '1'

      - name: Exercise bundled Archify using the production package
        shell: bash
        run: |
          set -euo pipefail
          executables=(apps/desktop/out/*/*.app/Contents/MacOS/*)
          test "${#executables[@]}" -eq 1
          test -x "${executables[0]}"
          SPRINT_CODER_E2E_EXECUTABLE_PATH="${PWD}/${executables[0]}" \
            npx playwright test tests/e2e/archify-graph.spec.ts --workers=1
        env:
          SPRINT_CODER_E2E_MODE: packaged
          SPRINT_CODER_E2E_HIDDEN: '0'
          SPRINT_CODER_ALLOW_ADHOC_CODESIGN: '1'
      - name: Upload macOS packaged Archify evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: archify-packaged-macos
          path: test-results
          if-no-files-found: ignore
  platform-tests:
    name: ${{ matrix.label }} test shard ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            shard: 1/3
          - os: ubuntu-latest
            label: Linux
            shard: 2/3
          - os: ubuntu-latest
            label: Linux
            shard: 3/3
          - os: windows-2022
            label: Windows
            shard: 1/5
          - os: windows-2022
            label: Windows
            shard: 2/5
          - os: windows-2022
            label: Windows
            shard: 3/5
          - os: windows-2022
            label: Windows
            shard: 4/5
          - os: windows-2022
            label: Windows
            shard: 5/5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Warm Windows process identity query
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $identity = & $windowsPowerShell -NoProfile -NonInteractive -Command `
            '(Get-Process -Id $PID -ErrorAction Stop).StartTime.ToUniversalTime().Ticks'
          if ($LASTEXITCODE -ne 0 -or -not $identity) {
            throw 'Windows process identity query warm-up failed'
          }

      - name: Test desktop shard ${{ matrix.shard }} on Linux
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }}

      - name: Test desktop shard ${{ matrix.shard }} on Windows
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }} --maxWorkers=1 --exclude src/main/team-coordinator.test.ts --exclude src/main/graph-mission-persistence.test.ts

  electron-bridges:
    name: ${{ matrix.label }} ${{ matrix.suite }} Electron bridge ${{ matrix.shard }}/4
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows
            suite: coordinator
            file: src/main/team-coordinator.test.ts
            shard: 0
          - os: windows-2022
            label: Windows
