name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    timeout-minutes: 45
    strategy:
      # Stop the remaining platforms when one has already proved the commit bad.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest
          - os: macos-latest
            label: macos-latest
          # The Electron node-gyp revision in the lockfile supports Visual Studio
          # through 2022. GitHub moved windows-latest to Visual Studio 2026, so
          # keep these jobs on the supported image until that dependency is updated.
          # Windows intentionally uses one Vitest worker for process stability; split
          # the files across independent runners instead of weakening that guardrail.
          - os: windows-2022
            label: windows-2022, shard 1/2
            windows_shard: 1/2
          - os: windows-2022
            label: windows-2022, shard 2/2
            windows_shard: 2/2
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # @electron/packager 18.x depends on extract-zip 2.x/yauzl 2.x.
          # Its Electron archive extraction does not complete on Node 24+.
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 43 downloads its platform binary on first use instead of from
      # an npm install script. Install it once before Vitest workers can race to
      # extract the same archive into node_modules/electron/dist.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Verify Electron binary
        run: node node_modules/electron/cli.js -p "process.versions.electron"
        env:
          ELECTRON_RUN_AS_NODE: '1'

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Format check
        if: runner.os == 'Linux'
        run: npm run format:check

      # Rebuilds better-sqlite3 against this project's Electron ABI. Ordered
      # before test to catch native-module/Electron ABI regressions early.
      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Build NativeSafeFs for Electron ABI
        run: npm run build:native-safe-fs

      - name: Test
        if: runner.os != 'Windows'
        run: npm run test

      - name: Test Windows shard ${{ matrix.windows_shard }}
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.windows_shard }}

      - name: Provision Inno Setup
        if: github.event_name == 'push' && runner.os == 'Windows' && matrix.windows_shard == '1/2'
        shell: pwsh
        run: ./apps/desktop/scripts/ensure-inno-setup.ps1

      - name: Make Windows wizard installer
        if: github.event_name == 'push' && runner.os == 'Windows' && matrix.windows_shard == '1/2'
        working-directory: apps/desktop
        run: npx electron-forge make --platform=win32 --arch=x64

      - name: Verify Windows wizard artifact
        if: github.event_name == 'push' && runner.os == 'Windows' && matrix.windows_shard == '1/2'
        shell: pwsh
        run: |
          $directory = 'apps/desktop/out/make/squirrel.windows/x64'
          $wizard = Join-Path $directory 'Sprint-Coder-Installer.exe'
          $rawSetup = Join-Path $directory 'Sprint-Coder-Setup.exe'
          if (-not (Test-Path -LiteralPath $wizard -PathType Leaf)) {
            throw "Wizard installer was not created: $wizard"
          }
          if (Test-Path -LiteralPath $rawSetup) {
            throw "Raw Squirrel setup must not remain user-facing: $rawSetup"
          }
          Get-Item -LiteralPath $wizard | Format-List FullName,Length,VersionInfo

      # Keep one production-package boundary check without running the full serial UI suite.
      # This catches Forge, fuse, native-module, and packaged-startup regressions on Linux while
      # avoiding the 15+ minute Windows packaged E2E critical path.
      - name: Packaged startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test tests/e2e/keyboard-smoke.spec.ts
        env:
          SPRINT_CODER_E2E_MODE: packaged

      # Exercise the Windows-only npm.cmd spawn and taskkill /PID /T teardown path. This proves
      # that a clean Windows checkout can run development-mode E2E without a manually started
      # dev server.
      - name: Dev-mode E2E auto-start smoke (Windows)
        if: runner.os == 'Windows' && matrix.windows_shard == '1/2'
        run: npx playwright test tests/e2e/keyboard-smoke.spec.ts
        env:
          SPRINT_CODER_E2E_MODE: dev

  # Preserve the pre-sharding Windows check name for existing branch-protection rules.
  windows-result:
    name: build (windows-2022)
    if: always()
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify matrix result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "${BUILD_RESULT}" = 'success'
