  renderer-e2e:
    name: Focused UI E2E (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.e2e_specs != '[]' && needs.classify.outputs.e2e_specs != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.e2e_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Electron binary
        uses: ./.github/actions/install-electron

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Configure Linux Chromium sandbox helper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e "const s = require('node:fs').lstatSync('node_modules/electron/dist/chrome-sandbox'); if (!s.isFile() || s.isSymbolicLink()) process.exit(1);"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          node -e "const s = require('node:fs').lstatSync('node_modules/electron/dist/chrome-sandbox'); if (s.uid !== 0 || s.gid !== 0 || (s.mode & 0o7777) !== 0o4755) process.exit(1);"

      - name: Run selected UI cases on Linux
        if: runner.os == 'Linux'
        env:
          CI_E2E_SPECS: ${{ toJSON(matrix.specs) }}
          # Xvfb isolates the desktop; focus and screenshots still require a mapped window.
          SPRINT_CODER_E2E_HIDDEN: '0'
        run: xvfb-run -a node ci-renderer-tests.mjs e2e
      - name: Run selected UI cases on macOS
        if: runner.os == 'macOS'
        env:
          CI_E2E_SPECS: ${{ toJSON(matrix.specs) }}
          SPRINT_CODER_E2E_HIDDEN: '0'
        run: node ci-renderer-tests.mjs e2e
      - name: Upload focused UI evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: renderer-e2e-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-renderer
          if-no-files-found: warn

