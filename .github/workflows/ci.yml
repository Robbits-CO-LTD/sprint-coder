name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # npm ci runs install scripts by default (no .npmrc ignore-scripts here),
      # which is required so better-sqlite3 compiles its native binding and
      # electron downloads its platform binary during this step.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Rebuilds better-sqlite3 against this project's Electron ABI. Ordered
      # before test to catch native-module/Electron ABI regressions early
      # (recurrence of an ABI mismatch previously seen in local development).
      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Test
        run: npm run test

      - name: Package smoke (macOS, required)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: npx electron-forge package

      - name: Package smoke (Windows/Linux, best-effort)
        if: matrix.os != 'macos-latest'
        continue-on-error: true
        working-directory: apps/desktop
        run: npx electron-forge package
