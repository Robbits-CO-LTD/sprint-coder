  e2e-windows:
    name: Windows major E2E (${{ matrix.group }})
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [core, archify]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Electron binary
        uses: ./.github/actions/install-electron
      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build managed sandbox runner
        uses: ./.github/actions/prepare-sandbox
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json', 'build-better-sqlite3.mjs') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: node ../../build-better-sqlite3.mjs
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Run Windows major E2E
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'windows-e2e.log'
          & npx.cmd playwright test --config playwright.windows.config.ts 2>&1 |
            Tee-Object -FilePath $logPath
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
        env:
          SPRINT_CODER_E2E_MODE: dev
          SPRINT_CODER_WINDOWS_E2E_GROUP: ${{ matrix.group }}
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-e2e-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/windows-e2e.log
          if-no-files-found: warn
          retention-days: 14

  archify-packaged:
    name: Archify packaged (${{ matrix.os }}, ${{ matrix.shard }}/2)
    needs: [classify, package-windows-build]
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download this run's Windows production package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.package-windows-build.outputs.artifact }}
          path: ${{ runner.temp }}/ci-windows-package/
      - name: Verify and restore the Windows production package
        env:
          CI_WINDOWS_PACKAGE_SHA256: ${{ needs.package-windows-build.outputs.archive_sha256 }}
        run: node ci-windows-package.mjs restore
      - name: Exercise the real bundled Archify worker and sandboxed viewer
        env:
          SPRINT_CODER_E2E_MODE: packaged
          # A dedicated runner exercises normal window presentation. Hidden CI windows
          # can pass DOM hit tests while dropping native mouse delivery into the iframe.
          # Local E2E retains its independently configured hidden/non-focus mode.
          SPRINT_CODER_E2E_HIDDEN: '0'
          SPRINT_CODER_ALLOW_ADHOC_CODESIGN: '1'
        run: npm run e2e -- tests/e2e/archify-graph.spec.ts --fully-parallel --workers=1 --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: archify-packaged-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

