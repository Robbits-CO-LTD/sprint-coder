  package-windows-build:
    name: Windows production package
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.package-artifact.outputs.artifact }}
      archive_sha256: ${{ steps.package-artifact.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
