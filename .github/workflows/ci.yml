            file: src/main/team-coordinator.test.ts
            shard: 2
          - os: windows-2022
            label: Windows
            suite: coordinator
            file: src/main/team-coordinator.test.ts
            shard: 3
          - os: windows-2022
            label: Windows
            suite: graph
            file: src/main/graph-mission-persistence.test.ts
            shard: 0
          - os: windows-2022
            label: Windows
            suite: graph
            file: src/main/graph-mission-persistence.test.ts
            shard: 1
          - os: windows-2022
            label: Windows
            suite: graph
