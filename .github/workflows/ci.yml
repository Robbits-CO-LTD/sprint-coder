      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check website sources and local references
        run: node ci-website.mjs check
      - name: Check website validator regressions
        run: npm run test --workspace @sprint-coder/desktop -- ci-website.test.mjs
      # Hosted Ubuntu includes Chrome and its system libraries; avoid downloading a second browser.
      - name: Verify the runner browser
        run: google-chrome --version
      - name: Check desktop and mobile pages
        env:
          WEBSITE_BROWSER_CHANNEL: chrome
        run: npx playwright test --config playwright.website.config.ts
      - name: Upload website failure evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/website/
          if-no-files-found: warn

  required:
    name: CI required
    if: always()
    needs:
      [
        classify,
        quality,
        renderer-tests,
        renderer-e2e,
        package-tests,
        computer-use-native-gate,
        computer-use-windows-v2-harness,
        test-macos,
        package-macos,
        platform-tests,
        electron-bridges,
        package-linux,
        package-windows-build,
        package-windows,
        e2e-windows,
        archify-packaged,
        website,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify every selected check completed successfully
        env:
          CI_SCOPE_JSON: ${{ needs.classify.outputs.scope_json }}
          CI_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node ci-scope.mjs gate
