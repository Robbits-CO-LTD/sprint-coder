name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # npm ci runs install scripts by default (no .npmrc ignore-scripts here),
      # which is required so better-sqlite3 compiles its native binding and
      # electron downloads its platform binary during this step.
      - name: Install dependencies
        run: npm ci

      # The Electron binary has been arriving truncated on macOS runners: the
      # test suite's Electron ABI bridge specs died with
      #   dyld: Library not loaded: @rpath/Electron Framework.framework/...
      #   Reason: segment '__TEXT' load command content extends beyond end of file
      # i.e. the extracted framework was incomplete, and the on-demand re-download
      # the shim then attempted did not repair it either. Probe the binary once
      # here — where a failure is obvious and cheap — and purge both the package's
      # dist/ and the platform download cache before reinstalling, so a poisoned
      # cached zip cannot simply be re-extracted.
      - name: Verify Electron binary
        shell: bash
        run: |
          probe() {
            ELECTRON_RUN_AS_NODE=1 "$(node -p "require('electron')")" -e "process.exit(0)" \
              >/dev/null 2>&1
          }
          if probe; then
            echo "Electron binary is usable"
            exit 0
          fi
          echo "::warning::Electron binary is unusable; purging caches and reinstalling"
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          rm -rf "$HOME/Library/Caches/electron" "$HOME/.cache/electron" \
                 "$LOCALAPPDATA/electron/Cache" 2>/dev/null || true
          npm rebuild electron --foreground-scripts
          probe

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Rebuilds better-sqlite3 against this project's Electron ABI. Ordered
      # before test to catch native-module/Electron ABI regressions early
      # (recurrence of an ABI mismatch previously seen in local development).
      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Build NativeSafeFs for Electron ABI
        run: npm run build:native-safe-fs

      - name: Test
        run: npm run test

      - name: Package smoke (macOS, required)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: npx electron-forge package

      - name: Package smoke (Windows/Linux, best-effort)
        if: matrix.os != 'macos-latest'
        continue-on-error: true
        working-directory: apps/desktop
        run: npx electron-forge package
