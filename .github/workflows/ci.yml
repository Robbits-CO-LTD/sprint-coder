name: CI

# Automatic triggers are off for now. This workflow has never passed on any platform
# (see the CI issue): main was failing at Lint, and once that was cleared each OS surfaced a
# different pre-existing problem — a truncated Electron download on macOS, node-gyp being
# unable to recognise Visual Studio 2026 on the Windows runner image. Leaving it wired to
# every push and pull request only produced a permanent red X that told us nothing new, so
# it runs on demand until those are actually fixed.
#
# To re-enable, replace `workflow_dispatch:` below with the original triggers:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # npm ci runs install scripts by default (no .npmrc ignore-scripts here),
      # which is required so better-sqlite3 compiles its native binding and
      # electron downloads its platform binary during this step.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Rebuilds better-sqlite3 against this project's Electron ABI. Ordered
      # before test to catch native-module/Electron ABI regressions early
      # (recurrence of an ABI mismatch previously seen in local development).
      - name: Rebuild native modules for Electron ABI
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Build NativeSafeFs for Electron ABI
        run: npm run build:native-safe-fs

      - name: Test
        run: npm run test

      - name: Package smoke (macOS, required)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: npx electron-forge package

      - name: Package smoke (Windows/Linux, best-effort)
        if: matrix.os != 'macos-latest'
        continue-on-error: true
        working-directory: apps/desktop
        run: npx electron-forge package
