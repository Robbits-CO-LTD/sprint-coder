name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR classifier compares the real base and head commits. A complete checkout avoids
          # silently selecting the fast lane when a long-lived PR's base is outside a shallow clone.
          fetch-depth: 0

      - name: Select fast or full platform coverage
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          full_matrix=true
          if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
            full_matrix=false
            changed_files="$(git diff --no-renames --name-only "${BASE_SHA}" "${HEAD_SHA}")"
            printf '%s\n' "${changed_files}"

            # Native, process, packaging, E2E, dependency, and CI changes retain full OS coverage.
            if grep -Eq '(^|/)package(-lock)?\.json$|^\.github/workflows/|^build-(native-safe-fs|managed-local-sidecar)\.mjs$|^build-computer-use-native\.mjs$|^playwright.*\.ts$|^tests/e2e/|^apps/desktop/(forge\.config\.ts|vite\..*\.config\.ts|managed-local-release\.json|native-safe-fs/|computer-use-native/|scripts/)|^apps/desktop/src/(main|preload|runtime-host)/' <<< "${changed_files}"; then
              full_matrix=true
            fi
          fi

          echo "full_matrix=${full_matrix}" >> "${GITHUB_OUTPUT}"
          echo "Selected full matrix: ${full_matrix}"

  quality:
    name: quality (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: typecheck
            command: typecheck
          - label: lint
            command: lint
          - label: format
            command: format:check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.label }}
        run: npm run ${{ matrix.command }}

  quality-result:
    # Preserve the existing required check name while the three quality gates run in parallel.
    name: build (ubuntu-latest)
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify quality gates
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "${QUALITY_RESULT}" = 'success'

  package-tests:
    name: package tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test contracts and domain packages
        run: npm run test --workspace @sprint-coder/contracts --workspace @sprint-coder/domain

  computer-use-native-gate:
    name: Computer Use native Gate 0 (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Initialize MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and manifest native artifact
        run: npm run build:computer-use-native

      - name: Build deterministic Win32 acceptance fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'computer-use-win32-acceptance-fixture'
          ./apps/desktop/computer-use-native/fixtures/win32-acceptance/build.ps1 `
            -OutputDirectory $output

      - name: Run protocol harness with macOS sanitizers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/computer-use-protocol-harness"
          /usr/bin/clang++ \
            -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined \
            -I apps/desktop/computer-use-native \
            apps/desktop/computer-use-native/computer_use_protocol_fuzz.cc \
            -o "${harness}"
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            "${harness}"

      - name: Run protocol harness and attempt Windows ASan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'apps/desktop/computer-use-native/computer_use_protocol_fuzz.cc'
          $include = 'apps/desktop/computer-use-native'
          $normal = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness.exe'
          $normalObject = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness.obj'
          & cl.exe /nologo /std:c++20 /EHsc /W4 /GS /sdl "/I$include" $source "/Fo$normalObject" "/Fe$normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $asan = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness-asan.exe'
          $asanObject = Join-Path $env:RUNNER_TEMP 'computer-use-protocol-harness-asan.obj'
          & cl.exe /nologo /std:c++20 /EHsc /O1 /Zi /fsanitize=address "/I$include" $source "/Fo$asanObject" "/Fe$asan"
          if ($LASTEXITCODE -ne 0) {
            'Windows ASan: SKIP - windows-2022 MSVC sanitizer compile/link unavailable; mandatory malformed-frame harness passed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          & $asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Windows ASan: PASS' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify Gate 0 loader tests
        working-directory: apps/desktop
        run: >-
          npx vitest run
          src/main/computer-use-native.test.ts
          computer-use-native/fixtures/win32-acceptance/win32_acceptance_fixture.test.ts

  test-macos:
    name: macOS test shard ${{ matrix.shard }}
    needs: classify
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Test desktop shard ${{ matrix.shard }}
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }}

  package-macos:
    # Every CI invocation proves the production Forge boundary and its pinned Managed Local bundle.
    name: macOS production package smoke
    needs: classify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # forge.config.ts lists the runner in `extraResource` unconditionally, so packaging cannot
      # succeed without it. Every other job that packages or launches the app already builds it;
      # this one was missed, which made the fast-lane package smoke fail on any renderer-only PR —
      # exactly the PRs it is the only packaging coverage for.
      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Production package smoke
        working-directory: apps/desktop
        run: npx electron-forge package
        env:
          SPRINT_CODER_ALLOW_ADHOC_CODESIGN: '1'

      - name: Managed Local transport smoke
        working-directory: apps/desktop
        run: npx vitest run src/main/managed-local-runtime-supervisor.test.ts
        env:
          SPRINT_CODER_MANAGED_LOCAL_LIVE: '1'

  windows-smoke:
    name: Windows focused smoke
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.full_matrix != 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Warm Windows process identity query
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $identity = & $windowsPowerShell -NoProfile -NonInteractive -Command `
            '(Get-Process -Id $PID -ErrorAction Stop).StartTime.ToUniversalTime().Ticks'
          if ($LASTEXITCODE -ne 0 -or -not $identity) {
            throw 'Windows process identity query warm-up failed'
          }

      - name: Test Windows platform boundaries
        working-directory: apps/desktop
        run: >-
          npx vitest run
          src/main/command-runner.test.ts
          src/main/native-file-publication.test.ts
          src/main/process-tree.test.ts
          src/main/team-mcp-bridge.test.ts
          src/main/windows-acl.test.ts
          src/main/workspace-edit.test.ts
          src/main/workspace-watcher.test.ts
          src/runtime-host/team-mcp-node-command.test.ts
          --maxWorkers=1

  platform-tests:
    name: ${{ matrix.label }} test shard ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-2022]
        shard: [1/3, 2/3, 3/3]
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-2022
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner

      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}

      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3

      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}

      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs

      - name: Warm Windows process identity query
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $identity = & $windowsPowerShell -NoProfile -NonInteractive -Command `
            '(Get-Process -Id $PID -ErrorAction Stop).StartTime.ToUniversalTime().Ticks'
          if ($LASTEXITCODE -ne 0 -or -not $identity) {
            throw 'Windows process identity query warm-up failed'
          }

      - name: Test desktop shard ${{ matrix.shard }} on Linux
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }}

      - name: Test desktop shard ${{ matrix.shard }} on Windows
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx vitest run --shard=${{ matrix.shard }} --maxWorkers=1

  package-linux:
    name: Linux packaged startup smoke
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Packaged startup smoke
        run: xvfb-run -a npx playwright test tests/e2e/keyboard-smoke.spec.ts
        env:
          SPRINT_CODER_E2E_MODE: packaged
      - name: Managed Local transport smoke
        working-directory: apps/desktop
        run: npx vitest run src/main/managed-local-runtime-supervisor.test.ts
        env:
          SPRINT_CODER_MANAGED_LOCAL_LIVE: '1'

  package-windows:
    name: Windows installer smoke
    needs: classify
    if: needs.classify.outputs.full_matrix == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Build managed sandbox runner
        run: npm run build:sandbox-runner
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Provision Inno Setup
        shell: pwsh
        run: ./apps/desktop/scripts/ensure-inno-setup.ps1
      - name: Make Windows wizard installer
        working-directory: apps/desktop
        run: npx electron-forge make --platform=win32 --arch=x64
      - name: Managed Local transport smoke
        working-directory: apps/desktop
        run: npx vitest run src/main/managed-local-runtime-supervisor.test.ts
        env:
          SPRINT_CODER_MANAGED_LOCAL_LIVE: '1'
      - name: Managed Local coding smoke (CPU fallback)
        working-directory: apps/desktop
        run: npx vitest run src/main/managed-local-coding-live-smoke.test.ts
        env:
          SPRINT_CODER_MANAGED_LOCAL_CODING_LIVE: '1'
      - name: Verify Windows wizard artifact
        shell: pwsh
        run: ./apps/desktop/scripts/verify-unsigned-windows-release.ps1

  e2e-windows:
    name: Windows major E2E
    needs: classify
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Restore better-sqlite3 Electron ABI binary
        id: better-sqlite-cache
        uses: actions/cache@v6
        with:
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          key: electron-better-sqlite3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'apps/desktop/package.json') }}
      - name: Rebuild better-sqlite3 for Electron ABI
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3
      - name: Restore NativeSafeFs Electron ABI binary
        id: native-safe-fs-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/native-safe-fs/build/Release/sprint_coder_native_safe_fs.node
          key: electron-native-safe-fs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'build-native-safe-fs.mjs', 'apps/desktop/native-safe-fs/binding.gyp', 'apps/desktop/native-safe-fs/*.cc', 'apps/desktop/native-safe-fs/*.h') }}
      - name: Build NativeSafeFs for Electron ABI
        if: steps.native-safe-fs-cache.outputs.cache-hit != 'true'
        run: npm run build:native-safe-fs
      - name: Run Windows major E2E
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'windows-e2e.log'
          & npx.cmd playwright test --config playwright.windows.config.ts 2>&1 |
            Tee-Object -FilePath $logPath
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
        env:
          SPRINT_CODER_E2E_MODE: dev
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/windows-e2e.log
          if-no-files-found: warn
          retention-days: 14

  macos-result:
    name: build (macos-latest)
    if: always()
    needs: [classify, package-tests, test-macos, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify macOS and package coverage
        shell: bash
        env:
          PACKAGE_TEST_RESULT: ${{ needs.package-tests.result }}
          MACOS_TEST_RESULT: ${{ needs.test-macos.result }}
          MACOS_PACKAGE_RESULT: ${{ needs.package-macos.result }}
        run: |
          set -euo pipefail
          test "${PACKAGE_TEST_RESULT}" = 'success'
          test "${MACOS_TEST_RESULT}" = 'success'
          test "${MACOS_PACKAGE_RESULT}" = 'success'

  windows-result:
    name: build (windows-2022)
    if: always()
    needs: [classify, windows-smoke, platform-tests, package-linux, package-windows, e2e-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify selected platform coverage
        shell: bash
        env:
          FULL_MATRIX: ${{ needs.classify.outputs.full_matrix }}
          SMOKE_RESULT: ${{ needs.windows-smoke.result }}
          TEST_RESULT: ${{ needs.platform-tests.result }}
          LINUX_PACKAGE_RESULT: ${{ needs.package-linux.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.package-windows.result }}
          WINDOWS_E2E_RESULT: ${{ needs.e2e-windows.result }}
        run: |
          set -euo pipefail
          test "${WINDOWS_E2E_RESULT}" = 'success'
          if [[ "${FULL_MATRIX}" == 'true' ]]; then
            test "${TEST_RESULT}" = 'success'
            test "${LINUX_PACKAGE_RESULT}" = 'success'
            test "${WINDOWS_PACKAGE_RESULT}" = 'success'
          else
            test "${SMOKE_RESULT}" = 'success'
          fi

  required:
    name: CI required
    if: always()
    needs: [quality-result, macos-result, windows-result, computer-use-native-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required checks
        env:
          QUALITY_RESULT: ${{ needs.quality-result.result }}
          MACOS_RESULT: ${{ needs.macos-result.result }}
          WINDOWS_RESULT: ${{ needs.windows-result.result }}
          COMPUTER_USE_NATIVE_RESULT: ${{ needs.computer-use-native-gate.result }}
        run: |
          test "${QUALITY_RESULT}" = 'success'
          test "${MACOS_RESULT}" = 'success'
          test "${WINDOWS_RESULT}" = 'success'
          test "${COMPUTER_USE_NATIVE_RESULT}" = 'success'
