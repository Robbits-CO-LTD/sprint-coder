name: pr564-restore-assemble
on:
  push:
    branches: [claude/issue-544-retained-worktrees]
    paths:
      - 'apps/desktop/src/main/.restore-pr564/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/issue-544-retained-worktrees
      - name: Assemble worker-worktree.test.ts
        run: |
          set -euo pipefail
          D=apps/desktop/src/main/.restore-pr564
          test -f "$D/p00.b64"
          test -f "$D/p01.b64"
          test -f "$D/p02.b64"
          test -f "$D/p03.b64"
          test -f "$D/p04.b64"
          test -f "$D/p05.b64"
          test -f "$D/p06.b64"
          test -f "$D/p07.b64"
          test -f "$D/p08.b64"
          test -f "$D/p09.b64"
          test -f "$D/p10.b64"
          test -f "$D/p11.b64"
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          D = pathlib.Path('apps/desktop/src/main/.restore-pr564')
          exp = json.loads((D / 'expected.json').read_text())
          parts = []
          for i in range(exp['parts']):
              parts.append(base64.b64decode((D / f'p{i:02d}.b64').read_text().strip()))
          c = b''.join(parts)
          pathlib.Path('apps/desktop/src/main/worker-worktree.test.ts').write_bytes(c)
          blob = hashlib.sha1(b'blob %d\0' % len(c) + c).hexdigest()
          print('assembled', len(c), blob)
          assert blob == exp['blob'], (blob, exp['blob'])
          assert b'PLACEHOLDER' not in c
          assert b'@/workspace' not in c
          PY
      - name: Commit assembled file and remove restore leftovers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/main/worker-worktree.test.ts
          git rm -r --ignore-unmatch apps/desktop/src/main/.restore-pr564 || true
          git rm --ignore-unmatch .github/workflows/pr564-restore-assemble.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "fix(team): restore worker-worktree.test.ts (portable linked gitignore)"
          git push
