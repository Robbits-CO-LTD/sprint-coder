name: pr564-restore-assemble
on:
  push:
    branches: [claude/issue-544-retained-worktrees]
    paths:
      - 'apps/desktop/src/main/.restore-pr564/**'
      - '.github/workflows/pr564-restore-assemble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/issue-544-retained-worktrees
          fetch-depth: 0
      - name: Restore worker-worktree.test.ts from 75b79fa + portable gitignore
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          src = '75b79fa4cf76edfac5acb28331560d8735a4851c:apps/desktop/src/main/worker-worktree.test.ts'
          dest = pathlib.Path('apps/desktop/src/main/worker-worktree.test.ts')
          orig = subprocess.check_output(['git', 'show', src])
          old = b"    await writeFile(join(repoPath, '.gitignore'), 'linked/\\n');\n"
          new = (
              b"    // No trailing slash: on Unix a directory symlink is a file entry for gitignore,\n"
              b"    // so `linked/` (directories only) leaves `?? linked` and the reclaim path never runs.\n"
              b"    // Windows junctions match both `linked` and `linked/`; use the portable form.\n"
              b"    await writeFile(join(repoPath, '.gitignore'), 'linked\\n');\n"
          )
          assert old in orig, 'expected linked/ gitignore write missing from 75b79fa'
          c = orig.replace(old, new, 1)
          dest.write_bytes(c)
          blob = hashlib.sha1(b'blob %d\0' % len(c) + c).hexdigest()
          print('assembled', len(c), blob)
          assert blob == '43db91cec0bfa2a56e3cc97a4399d44c4d6c50e2', blob
          assert b'PLACEHOLDER' not in c
          PY
      - name: Commit assembled file and remove restore leftovers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/main/worker-worktree.test.ts
          git rm -r --ignore-unmatch apps/desktop/src/main/.restore-pr564 || true
          git rm --ignore-unmatch .github/workflows/pr564-restore-assemble.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "fix(team): restore worker-worktree.test.ts (portable linked gitignore)"
          git push
